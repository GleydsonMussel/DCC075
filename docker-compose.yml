services:
  biohazard:
    image: biohazard
    build: ./container
    stdin_open: true      # equivalente a -it
    tty: true             # mantém o terminal interativo
    read_only: true       # equivalente a --read-only

    tmpfs:
      - /tmp:rw,size=256m # cria sistema de arquivos temporário

    cap_drop:
      - ALL               # remove todas as capabilities do kernel

    security_opt:
      - no-new-privileges:true  # impede processos de ganharem privilégios

    volumes:
      - ./reports:/opt/analysis  # bind mount para relatórios

    environment:
      - NPM_CONFIG_CACHE=/tmp/npm-cache

    restart: "no"         # equivalente a --rm (não reinicia)
